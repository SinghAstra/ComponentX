name: PR Agent

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  issue_comment:

jobs:
  pr_agent:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: write
      contents: write
      checks: write

    steps:
      - name: Run PR-Agent
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          config.model: "openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"
          config.fallback_models: '["openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"]'

          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_BASE: "https://openrouter.ai/api/v1"

          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"

          pr_reviewer.extra_instructions: "Review correctness, security, error handling, performance, and TypeScript quality. Report only actionable findings."